[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-intelligence"
version = "0.1.0"
description = "F1 Race Intelligence: data ingestion foundation for a future MLOps pipeline built on OpenF1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "F1 Race Intelligence" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    # Consolidation (M4) onwards: merge_asof implements the backward-in-time
    # joins the lap dataset needs, and pyarrow writes the Parquet output.
    "pandas>=2.0",
    "pyarrow>=14.0",
    # Modeling datasets (M6): the split-aware preprocessing is built from
    # ColumnTransformer, SimpleImputer, StandardScaler and OneHotEncoder, and
    # joblib persists the transformer fitted on the training races.
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
# S3 storage backend. Optional: local runs never import boto3. Conditional
# writes (If-None-Match), which keep execution records from overwriting each
# other on S3, need boto3/botocore 1.35.2 or newer.
aws = [
    "boto3>=1.35.2",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[project.scripts]
f1-pipeline = "f1_race_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call the real OpenF1 API (require internet; run explicitly with `pytest -m integration`)",
]
