AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  F1 Race Intelligence - base infrastructure and availability-gated orchestration.
  Creates the data lake bucket, the OpenF1 availability checker, the pipeline state
  machine (M2-M6 as placeholders), alerting, logs, ECR and least-privilege IAM roles,
  and - once their images are pushed and tagged - the race model (M7): Fargate
  training/update tasks behind a state machine, and a forecast Lambda.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Project }
        Parameters: [ProjectName, Environment]
      - Label: { default: Storage }
        Parameters: [S3BucketName, NoncurrentVersionExpirationDays]
      - Label: { default: Orchestration }
        Parameters: [AvailabilitySchedule, AvailabilityScheduleState, PipelineEnabled, OpenF1BaseUrl]
      - Label: { default: Observability }
        Parameters: [LogRetentionDays, AlertEmail]
      - Label: { default: Race model (M7) }
        Parameters: [ModelImageTag, ModelVpcId, ModelSubnetIds, ModelTrainingSchedule, ModelUpdateSchedule, ModelScheduleState, ForecastImageTag, LiveForecastScheduleState]

Parameters:
  ProjectName:
    Type: String
    Default: f1-race-intelligence
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"
    ConstraintDescription: 3-25 characters, lowercase letters, digits and hyphens, starting with a letter.
    Description: Prefix for resource names and the Project tag.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment; part of every resource name.

  S3BucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Empty, or a valid S3 bucket name.
    Description: >-
      Name of the data lake bucket. Leave empty to use
      <ProjectName>-<Environment>-<AccountId>-<Region>, which is globally unique.

  NoncurrentVersionExpirationDays:
    Type: Number
    Default: 90
    MinValue: 7
    MaxValue: 3650
    Description: Days an overwritten or deleted object version is kept before it expires.

  AvailabilitySchedule:
    Type: String
    Default: rate(15 minutes)
    AllowedValues:
      - rate(15 minutes)
      - rate(30 minutes)
      - rate(1 hour)
      - rate(3 hours)
      - rate(6 hours)
      - rate(12 hours)
      - rate(1 day)
    Description: >-
      How often the OpenF1 availability checker runs. Limited to non-aggressive
      frequencies on purpose: the check itself is one request, but OpenF1 is a shared
      public API.

  AvailabilityScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >-
      Turn the periodic availability check on or off without deleting it. DISABLED by
      default, so a deploy that omits this parameter never starts the schedule; ENABLED
      only as a deliberate, reviewed choice.

  PipelineEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether an available OpenF1 lets the state machine continue into M2-M6. Keep
      "false" until the batch jobs are deployed and verified; today M2-M6 are
      placeholders either way.

  OpenF1BaseUrl:
    Type: String
    Default: https://api.openf1.org/v1
    AllowedPattern: "^https://.+[^/]$"
    Description: OpenF1 API base URL (HTTPS, no trailing slash).

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Retention of every CloudWatch log group created by this stack.

  AlertEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: >-
      Optional e-mail subscribed to critical alerts. Empty creates no subscription, and
      then alarms and Lambda failures publish to a topic nobody receives. A real address
      gets a confirmation e-mail; alerts are delivered only after it is confirmed.

  # --- Race model (M7). Everything below is off until its image exists. ---
  ModelImageTag:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
    Description: >-
      Tag of the batch image (PipelineImageRepository) the race-model tasks run. Empty
      creates no ECS cluster, task definition or model state machine.

  ModelVpcId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vpc-[0-9a-f]+$"
    Description: VPC of the race-model Fargate tasks (the default VPC is fine). Required with ModelImageTag.

  ModelSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Public subnets for the race-model Fargate tasks (they need egress to S3, ECR and
      CloudWatch; a public IP avoids a NAT gateway). Required with ModelImageTag.

  ModelTrainingSchedule:
    Type: String
    Default: cron(0 6 1 * ? *)
    Description: When the model is retrained (train, then evaluate and promote). Default monthly.

  ModelUpdateSchedule:
    Type: String
    Default: cron(0 8 ? * MON *)
    Description: When the season state is refreshed with the last race (Monday after a race weekend).

  ModelScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Both model schedules. DISABLED by default; runs can always be started by hand.

  ForecastImageTag:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
    Description: >-
      Tag of the forecast image (ForecastImageRepository, Dockerfile.forecast). Empty
      creates no forecast Lambda.

  LiveForecastScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >-
      Invoke the forecast Lambda every minute in live mode. It does nothing outside a race,
      but OpenF1 serves live data only to authenticated users during sessions: keep it
      DISABLED until that access is configured.

Conditions:
  UseGeneratedBucketName: !Equals [!Ref S3BucketName, ""]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasModelCompute: !And
    - !Not [!Equals [!Ref ModelImageTag, ""]]
    - !Not [!Equals [!Ref ModelVpcId, ""]]
    - !Not [!Equals [!Join ["", !Ref ModelSubnetIds], ""]]
  HasForecastFunction: !Not [!Equals [!Ref ForecastImageTag, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 128
    Timeout: 15
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      ManagedBy: sam

Resources:
  # ---------------------------------------------------------------------------
  # Storage: the data lake
  # ---------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    # Data outlives the stack: deleting the stack must never delete the lake.
    # RetainExceptOnCreate: a failed first create rolls the (still empty) bucket
    # back, so a retry is not blocked by the fixed name.
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - UseGeneratedBucketName
        - !Sub "${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}"
        - !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionExpirationDays
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          # Raw OpenF1 responses are rarely read after consolidation but are the
          # expensive part to rebuild: keep them, let S3 tier them by access.
          - Id: raw-intelligent-tiering
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
          - Id: manifests-intelligent-tiering
            Status: Enabled
            Prefix: manifests/
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 90
          # Reserved prefix for run logs: operational data, not a dataset.
          - Id: expire-logs
            Status: Enabled
            Prefix: logs/
            ExpirationInDays: 365
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: sam }
        - { Key: DataClassification, Value: public-source-derived }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------------------
  # Container registry for the batch image (M2-M6)
  # ---------------------------------------------------------------------------
  PipelineImageRepository:
    Type: AWS::ECR::Repository
    # Same reasoning as DataBucket: kept on stack deletion, removed only when the
    # very first create rolls back.
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-${Environment}-pipeline"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7},
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep the 30 most recent images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30},
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: sam }

  ForecastImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-${Environment}-forecast"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Lambda pulls container images with the service principal; only functions
      # of this project and environment, in this account, may do so.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPullFromThisProject
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${Environment}-*"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7},
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep the 30 most recent images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30},
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: sam }

  # ---------------------------------------------------------------------------
  # Alerting
  # ---------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-critical-alerts"
      DisplayName: !Sub "F1 Race Intelligence ${Environment} alerts"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: sam }

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmsFromThisAccount
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------
  # Log groups (created explicitly so retention is always applied)
  # ---------------------------------------------------------------------------
  AvailabilityCheckerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-openf1-availability"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  PipelineStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # The /aws/vendedlogs/ prefix keeps Step Functions from growing the
      # account-wide CloudWatch Logs resource policy.
      LogGroupName: !Sub "/aws/vendedlogs/states/${ProjectName}-${Environment}-pipeline"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  DataProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # For the future M2-M6 container tasks.
      LogGroupName: !Sub "/aws/ecs/${ProjectName}-${Environment}-pipeline"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------------------
  # IAM (least privilege, one role per responsibility)
  # ---------------------------------------------------------------------------
  AvailabilityCheckerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-availability-lambda"
      Description: Execution role of the OpenF1 availability checker. No S3 access.
      # Standard Lambda execution-role trust, without aws:SourceAccount: support for
      # that condition on Lambda execution roles could not be verified, and an
      # unsupported condition could make CreateFunction fail. The other roles keep it.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AvailabilityCheckerLogGroup.Arn}"
        - PolicyName: publish-invocation-results
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OnSuccessDestination
                Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt OrchestrationEventBus.Arn
              - Sid: OnFailureDestination
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  PipelineStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-pipeline-states"
      Description: >-
        Execution role of the pipeline state machine. Today it can only publish alerts and
        write its logs; ECS RunTask and PassRole are added when the M2-M6 jobs exist.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: publish-critical-alerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
        - PolicyName: deliver-execution-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Step Functions log delivery is configured through these
              # account-level APIs, which do not support resource-level
              # permissions (AWS documents Resource "*").
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  AvailabilityResultRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-availability-to-states"
      Description: Lets EventBridge start the pipeline state machine with an availability result.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref PipelineStateMachine
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # Future data-processing roles (M2-M6 container tasks). Created now so their
  # permissions are reviewed together with the rest; nothing assumes them yet.
  DataProcessingTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-data-processing"
      Description: >-
        Future task role of the M2-M6 batch jobs: read/write the pipeline prefixes of the
        data lake. No delete, no access to models/.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: data-lake-pipeline-prefixes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Deliberately not narrowed with an s3:prefix condition. Without
              # ListBucket on the bucket, HeadObject/GetObject on a missing key
              # return 403 instead of 404, and the pipeline's idempotency
              # checks ("does this file already exist?") would fail. HeadObject
              # requests carry no s3:prefix, so a prefix condition cannot grant
              # it. Listing exposes key names of this project bucket only.
              - Sid: ListProjectBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: ReadWritePipelineObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub "${DataBucket.Arn}/raw/*"
                  - !Sub "${DataBucket.Arn}/validated/*"
                  - !Sub "${DataBucket.Arn}/consolidated/*"
                  - !Sub "${DataBucket.Arn}/features/*"
                  - !Sub "${DataBucket.Arn}/modeling/*"
                  - !Sub "${DataBucket.Arn}/manifests/*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  DataProcessingExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-data-processing-exec"
      Description: Future ECS task execution role - pull the pipeline image and write container logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-pipeline-image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"  # this action has no resource-level permissions
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !GetAtt PipelineImageRepository.Arn
        - PolicyName: write-container-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${DataProcessingLogGroup.Arn}"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------------------
  # Availability checker
  # ---------------------------------------------------------------------------
  AvailabilityCheckerFunction:
    Type: AWS::Serverless::Function
    DependsOn: AvailabilityCheckerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-openf1-availability"
      Description: Probes a lightweight historical OpenF1 endpoint and returns a structured availability verdict.
      CodeUri: functions/availability_checker/
      Handler: app.handler
      Role: !GetAtt AvailabilityCheckerRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          OPENF1_BASE_URL: !Ref OpenF1BaseUrl
          OPENF1_PROBE_PATH: /sessions?session_key=7953
          OPENF1_TIMEOUT_SECONDS: "5"
          METRICS_NAMESPACE: !Sub "${ProjectName}/${Environment}"
      EventInvokeConfig:
        # A missed check is harmless (the next one is minutes away); retrying
        # would only add load on OpenF1.
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 900
        DestinationConfig:
          OnSuccess:
            Type: EventBridge
            Destination: !GetAtt OrchestrationEventBus.Arn
          OnFailure:
            Type: SNS
            Destination: !Ref AlertTopic

  AvailabilityScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-openf1-availability-schedule"
      Description: Periodically checks whether historical OpenF1 data can be requested.
      ScheduleExpression: !Ref AvailabilitySchedule
      State: !Ref AvailabilityScheduleState
      Targets:
        - Id: availability-checker
          Arn: !GetAtt AvailabilityCheckerFunction.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 600

  AvailabilityScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AvailabilityCheckerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AvailabilityScheduleRule.Arn
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # Availability result -> pipeline
  # ---------------------------------------------------------------------------
  OrchestrationEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-orchestration"

  AvailabilityResultRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-availability-result"
      Description: >-
        Every successful availability check starts the pipeline state machine with the
        checker's JSON result; the state machine decides whether anything runs.
      EventBusName: !Ref OrchestrationEventBus
      EventPattern:
        source: [lambda]
        detail-type: [Lambda Function Invocation Result - Success]
        resources:
          - prefix: !GetAtt AvailabilityCheckerFunction.Arn
      State: ENABLED
      Targets:
        - Id: pipeline-state-machine
          Arn: !Ref PipelineStateMachine
          RoleArn: !GetAtt AvailabilityResultRuleRole.Arn
          InputPath: $.detail.responsePayload
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 900

  # ---------------------------------------------------------------------------
  # Pipeline orchestration
  # ---------------------------------------------------------------------------
  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-pipeline"
      Type: STANDARD
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        Environment: !Ref Environment
        PipelineEnabled: !Ref PipelineEnabled
        DataBucketName: !Ref DataBucket
        AlertTopicArn: !Ref AlertTopic
      Role: !GetAtt PipelineStateMachineRole.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PipelineStateMachineLogGroup.Arn
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: sam

  # ---------------------------------------------------------------------------
  # Race model (M7): training/update on Fargate, forecasts on Lambda
  # ---------------------------------------------------------------------------
  RaceModelLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ecs/${ProjectName}-${Environment}-race-model"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  ForecastFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-race-forecast"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${ProjectName}-${Environment}-race-model"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-race-model"
      Description: >-
        Task role of the race-model jobs (m7-train, m7-evaluate, m7-update): read raw/,
        read/write models/ and its reports. No delete, no other prefix.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: race-model-prefixes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListProjectBucket  # see DataProcessingTaskRole: HeadObject needs it to return 404
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: ReadRaw
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/raw/*"
              - Sid: ReadWriteModels
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub "${DataBucket.Arn}/models/m7/*"
                  - !Sub "${DataBucket.Arn}/manifests/models/m7/*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-race-model-exec"
      Description: ECS task execution role of the race-model jobs - pull the batch image, write their logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-pipeline-image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"  # this action has no resource-level permissions
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !GetAtt PipelineImageRepository.Arn
        - PolicyName: write-container-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${RaceModelLogGroup.Arn}"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelCluster:
    Type: AWS::ECS::Cluster
    Condition: HasModelCompute
    Properties:
      ClusterName: !Sub "${ProjectName}-${Environment}-race-model"
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      ClusterSettings:
        - { Name: containerInsights, Value: disabled }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasModelCompute
    Properties:
      GroupDescription: Race-model Fargate tasks - no inbound, HTTPS out only.
      VpcId: !Ref ModelVpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: S3, ECR, CloudWatch Logs }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasModelCompute
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-race-model"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "8192"
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      TaskRoleArn: !GetAtt RaceModelTaskRole.Arn
      ExecutionRoleArn: !GetAtt RaceModelExecutionRole.Arn
      ContainerDefinitions:
        - Name: race-model
          Image: !Sub "${PipelineImageRepository.RepositoryUri}:${ModelImageTag}"
          Essential: true
          Command: ["--stage", "m7-train"]
          ReadonlyRootFilesystem: false
          Environment:
            - { Name: F1_ENVIRONMENT, Value: aws }
            - { Name: F1_STORAGE_BUCKET, Value: !Ref DataBucket }
            - { Name: F1_STORAGE_REGION, Value: !Ref AWS::Region }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RaceModelLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: race-model
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelStateMachineRole:
    Type: AWS::IAM::Role
    Condition: HasModelCompute
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-race-model-states"
      Description: Runs the race-model Fargate tasks, waits for them (.sync) and publishes failures.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: run-race-model-tasks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunTask
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref RaceModelTaskDefinition
              - Sid: TrackTasks
                Effect: Allow
                Action: [ecs:StopTask, ecs:DescribeTasks]
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${RaceModelCluster}/*"
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt RaceModelTaskRole.Arn, !GetAtt RaceModelExecutionRole.Arn]
              - Sid: SyncIntegrationRule  # the managed rule Step Functions uses for runTask.sync
                Effect: Allow
                Action: [events:PutTargets, events:PutRule, events:DescribeRule]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"
        - PolicyName: publish-critical-alerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
        - PolicyName: deliver-execution-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: HasModelCompute
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-race-model"
      Type: STANDARD
      DefinitionUri: statemachine/model.asl.json
      DefinitionSubstitutions:
        Environment: !Ref Environment
        ClusterArn: !GetAtt RaceModelCluster.Arn
        TaskDefinitionArn: !Ref RaceModelTaskDefinition
        SecurityGroupId: !GetAtt RaceModelSecurityGroup.GroupId
        SubnetIdsJson: !Sub
          - '["${Ids}"]'
          - Ids: !Join ['","', !Ref ModelSubnetIds]
        AlertTopicArn: !Ref AlertTopic
      Role: !GetAtt RaceModelStateMachineRole.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt RaceModelStateMachineLogGroup.Arn
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: sam

  RaceModelScheduleRole:
    Type: AWS::IAM::Role
    Condition: HasModelCompute
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-race-model-schedule"
      Description: Lets EventBridge start the race-model state machine on its schedules.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-race-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref RaceModelStateMachine
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  RaceModelTrainingScheduleRule:
    Type: AWS::Events::Rule
    Condition: HasModelCompute
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-race-model-train"
      Description: Retrains the race model; the new version is promoted only if it beats the baseline.
      ScheduleExpression: !Ref ModelTrainingSchedule
      State: !Ref ModelScheduleState
      Targets:
        - Id: race-model-train
          Arn: !Ref RaceModelStateMachine
          RoleArn: !GetAtt RaceModelScheduleRole.Arn
          Input: '{"action": "train"}'

  RaceModelUpdateScheduleRule:
    Type: AWS::Events::Rule
    Condition: HasModelCompute
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-race-model-update"
      Description: Feeds the last race into the season state (frozen hyperparameters).
      ScheduleExpression: !Ref ModelUpdateSchedule
      State: !Ref ModelScheduleState
      Targets:
        - Id: race-model-update
          Arn: !Ref RaceModelStateMachine
          RoleArn: !GetAtt RaceModelScheduleRole.Arn
          Input: '{"action": "update"}'

  ForecastFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-race-forecast"
      Description: >-
        Execution role of the forecast Lambda: read raw/ and models/, write forecasts/.
        Nothing else.
      # Standard Lambda trust, for the same reason as AvailabilityCheckerRole.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ForecastFunctionLogGroup.Arn}"
        - PolicyName: forecast-prefixes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListProjectBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: ReadInputs
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${DataBucket.Arn}/raw/*"
                  - !Sub "${DataBucket.Arn}/models/m7/*"
                  - !Sub "${DataBucket.Arn}/forecasts/m7/*"
              - Sid: WriteForecasts
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/forecasts/m7/*"
        - PolicyName: report-failures
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # A plain Lambda resource (not AWS::Serverless::Function) so the zip-runtime
  # Globals above do not apply to this container-image function.
  ForecastFunction:
    Type: AWS::Lambda::Function
    Condition: HasForecastFunction
    DependsOn: ForecastFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-race-forecast"
      Description: In-race finishing-position forecast (M7) for one race and lap, or the race running now.
      PackageType: Image
      Code:
        ImageUri: !Sub "${ForecastImageRepository.RepositoryUri}:${ForecastImageTag}"
      Architectures: [x86_64]
      MemorySize: 3008
      Timeout: 120
      Role: !GetAtt ForecastFunctionRole.Arn
      Environment:
        Variables:
          F1_ENVIRONMENT: aws
          F1_STORAGE_BUCKET: !Ref DataBucket
      LoggingConfig:
        LogGroup: !Ref ForecastFunctionLogGroup
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  ForecastFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: HasForecastFunction
    Properties:
      FunctionName: !Ref ForecastFunction
      Qualifier: $LATEST
      # A forecast for lap k is stale a minute later; the next tick makes a fresh one.
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 120
      DestinationConfig:
        OnFailure:
          Destination: !Ref AlertTopic

  LiveForecastScheduleRule:
    Type: AWS::Events::Rule
    Condition: HasForecastFunction
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-race-forecast-live"
      Description: During a Grand Prix, forecasts from each newly completed lap; idle otherwise.
      ScheduleExpression: rate(1 minute)
      State: !Ref LiveForecastScheduleState
      Targets:
        - Id: race-forecast-live
          Arn: !GetAtt ForecastFunction.Arn
          Input: '{"mode": "live"}'

  LiveForecastInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasForecastFunction
    Properties:
      FunctionName: !Ref ForecastFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LiveForecastScheduleRule.Arn
      SourceAccount: !Ref AWS::AccountId

  ForecastFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasForecastFunction
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-race-forecast-errors"
      AlarmDescription: The forecast Lambda failed (bad input, missing model, OpenF1 or S3 errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ForecastFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  RaceModelExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasModelCompute
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-race-model-executions-failed"
      AlarmDescription: A race-model run failed (training, evaluation/promotion or update).
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - { Name: StateMachineArn, Value: !Ref RaceModelStateMachine }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ---------------------------------------------------------------------------
  # Alarms on critical infrastructure failures
  # ---------------------------------------------------------------------------
  AvailabilityCheckerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-availability-checker-errors"
      AlarmDescription: The availability checker crashed or timed out (HTTP problems are not errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref AvailabilityCheckerFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  PipelineExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-pipeline-executions-failed"
      AlarmDescription: A pipeline state machine execution failed, timed out or was aborted.
      Metrics:
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsFailed
              Dimensions:
                - { Name: StateMachineArn, Value: !Ref PipelineStateMachine }
            Period: 3600
            Stat: Sum
        - Id: timedout
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsTimedOut
              Dimensions:
                - { Name: StateMachineArn, Value: !Ref PipelineStateMachine }
            Period: 3600
            Stat: Sum
        - Id: aborted
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsAborted
              Dimensions:
                - { Name: StateMachineArn, Value: !Ref PipelineStateMachine }
            Period: 3600
            Stat: Sum
        - Id: total
          Expression: FILL(failed, 0) + FILL(timedout, 0) + FILL(aborted, 0)
          Label: Unsuccessful executions
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  OrchestrationRulesFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-orchestration-rules-failed"
      AlarmDescription: EventBridge could not invoke the availability checker or start the state machine.
      Metrics:
        - Id: schedule
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Events
              MetricName: FailedInvocations
              Dimensions:
                - { Name: RuleName, Value: !Ref AvailabilityScheduleRule }
            Period: 3600
            Stat: Sum
        - Id: result
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Events
              MetricName: FailedInvocations
              Dimensions:
                - { Name: EventBusName, Value: !Ref OrchestrationEventBus }
                - { Name: RuleName, Value: !Select [1, !Split ["|", !Ref AvailabilityResultRule]] }
            Period: 3600
            Stat: Sum
        - Id: total
          Expression: FILL(schedule, 0) + FILL(result, 0)
          Label: Failed rule invocations
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  OpenF1UnavailableSustainedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-openf1-unavailable-sustained"
      AlarmDescription: >-
        Every availability check in the last 6 hours reported OpenF1 as unavailable.
        Short outages (live sessions, rate limits) are expected and do not alarm.
      Namespace: !Sub "${ProjectName}/${Environment}"
      MetricName: OpenF1Available
      Dimensions:
        - { Name: Environment, Value: !Ref Environment }
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  DataBucketName:
    Description: Data lake bucket (raw/, validated/, consolidated/, features/, modeling/, models/, manifests/).
    Value: !Ref DataBucket
    Export: { Name: !Sub "${AWS::StackName}-DataBucketName" }
  AvailabilityCheckerFunctionArn:
    Description: OpenF1 availability checker Lambda ARN.
    Value: !GetAtt AvailabilityCheckerFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-AvailabilityCheckerFunctionArn" }
  PipelineStateMachineArn:
    Description: Pipeline state machine ARN (STANDARD).
    Value: !Ref PipelineStateMachine
    Export: { Name: !Sub "${AWS::StackName}-PipelineStateMachineArn" }
  AvailabilityScheduleRuleName:
    Description: EventBridge scheduled rule that runs the availability checker.
    Value: !Ref AvailabilityScheduleRule
  AvailabilityResultRuleName:
    Description: EventBridge rule (on the orchestration bus) that starts the state machine.
    Value: !Select [1, !Split ["|", !Ref AvailabilityResultRule]]
  OrchestrationEventBusName:
    Description: Custom event bus receiving availability results.
    Value: !Ref OrchestrationEventBus
  AlertTopicArn:
    Description: SNS topic for critical infrastructure alerts.
    Value: !Ref AlertTopic
    Export: { Name: !Sub "${AWS::StackName}-AlertTopicArn" }
  PipelineImageRepositoryUri:
    Description: ECR repository for the M2-M6 batch image.
    Value: !GetAtt PipelineImageRepository.RepositoryUri
  DataProcessingTaskRoleArn:
    Description: Future task role for the M2-M6 container jobs.
    Value: !GetAtt DataProcessingTaskRole.Arn
  DataProcessingExecutionRoleArn:
    Description: Future ECS task execution role (image pull, container logs).
    Value: !GetAtt DataProcessingExecutionRole.Arn
  ForecastImageRepositoryUri:
    Description: ECR repository for the forecast Lambda image (Dockerfile.forecast).
    Value: !GetAtt ForecastImageRepository.RepositoryUri
  RaceModelStateMachineArn:
    Condition: HasModelCompute
    Description: Race-model lifecycle (input {"action":"train"} or {"action":"update"}).
    Value: !Ref RaceModelStateMachine
  ForecastFunctionName:
    Condition: HasForecastFunction
    Description: Forecast Lambda (event {"session_key":..,"lap":..} or {"mode":"live"}).
    Value: !Ref ForecastFunction
