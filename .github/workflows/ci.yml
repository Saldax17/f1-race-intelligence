name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${EVENT_BEFORE}..${EVENT_SHA}"
          else
            git diff --check "${EVENT_SHA}^...${EVENT_SHA}"
          fi

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime-lock.txt
            requirements/dev-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements/runtime-lock.txt
          python -m pip install -r requirements/dev-lock.txt
          python -m pip install --editable . --no-deps --no-build-isolation
          python -m pip check
      - name: Run test suite
        run: python -m pytest -p no:cacheprovider -m "not integration" -ra --junitxml=pytest-results.xml
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}
          path: pytest-results.xml
          if-no-files-found: warn
      - name: Generate M6 hash manifest
        run: python scripts/ci/generate_m6_hash_manifest.py m6-hash-manifest.json
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m6-hash-${{ matrix.os }}
          path: m6-hash-manifest.json
          if-no-files-found: error

  hash-parity:
    name: hash-parity
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: m6-hash-*
          path: manifests
      - name: Compare M6 fingerprints and artifact hashes
        run: >-
          python scripts/ci/compare_m6_hash_manifests.py
          manifests/m6-hash-ubuntu-latest/m6-hash-manifest.json
          manifests/m6-hash-windows-latest/m6-hash-manifest.json
