openf1:
  base_url: "https://api.openf1.org/v1"

  timeout:
    connect: 5
    read: 30

  rate_limit:
    requests_per_second: 3
    requests_per_minute: 30

  retry:
    max_attempts: 3
    backoff_factor: 1

logging:
  level: "INFO"
  json_format: true

# What the historical extraction pipeline downloads. Change years, session
# types or endpoints here — never in code.
historical_extraction:
  years:
    - 2023
    - 2024
    - 2025

  # Matched case-insensitively against OpenF1's session_name or session_type,
  # so "Race", "Sprint", "Qualifying" or a coarser "Practice" all work.
  session_types:
    - "Race"

  endpoints:
    - drivers
    - laps
    - car_data
    - position
    - intervals
    - stints
    - pit
    - weather
    - race_control

  output_path: "data/raw"
  manifest_path: "data/manifests"

  # false: raw files already on disk are kept and skipped (idempotent re-runs).
  # true: everything is fetched again and overwritten.
  overwrite: false

# How the extracted raw data is judged. What each field may contain lives in
# validation/specs.py, next to the measurements that justify it.
validation:
  raw_path: "data/raw"
  manifest_path: "data/manifests"
  report_path: "data/validation"

  # An ERROR finding makes the run FAIL; false downgrades it to WARNING.
  fail_on_error: true

  # Null ratio above which a nullable field is reported as a WARNING.
  missing_value_threshold: 0.5

  # null validates every record — the only exhaustive mode, and the default.
  # A number turns the run into a deterministic quick check and the report
  # states that its result does not describe the whole dataset.
  max_records_per_file: null

  # Read the extraction manifest to tell "no data at the source" (HTTP 404)
  # apart from "the extraction failed and should be re-run".
  use_manifest: true

  write_csv: false

  enabled_rules:
    - structure
    - schema
    - types
    - values
    - missing_values
    - duplicates
    - temporal
    - identifiers
    - coverage

# How the raw data is assembled into the lap dataset (one row per driver,
# race and lap). Raw data is never modified.
consolidation:
  raw_path: "data/raw"
  output_path: "data/processed/lap_dataset"
  report_path: "data/consolidation"
  validation_path: "data/validation"

  # Empty means everything found in the raw tree.
  years: []
  session_keys: []

  # false: consolidate even when the latest validation run failed, recording
  # that fact in the report. true: refuse to run unless validation says PASS.
  require_validation_pass: false

  # How far back a lap may reach for the last weather reading. Readings come
  # every 60 s, so two cadences tolerate one missed reading.
  weather_tolerance_seconds: 120

  overwrite: false

# How the consolidated laps become a modelling dataset. Which columns are
# features, and why, is described in features/selection.py.
features:
  input_path: "data/processed/lap_dataset"
  output_path: "data/features/lap_features"
  report_path: "data/features/reports"

  years: []
  session_keys: []

  # Trailing windows in laps, ending at (and including) the current lap.
  rolling_windows: [3, 5]

  # Diagnostic only: report features that track the target this closely.
  # Nothing is dropped automatically — a high correlation is a reason to look.
  correlation_alert_threshold: 0.99

  # Refuse to write a session whose anti-leakage checks failed.
  fail_on_leakage: true

  overwrite: false

# How the feature dataset becomes train/validation/test artifacts.
# Preprocessing is always fitted on the training races alone.
modeling:
  input_path: "data/features/lap_features"
  output_path: "data/modeling"
  report_path: "data/modeling/reports"

  # The official dataset is 2023-2025. 2026 is still being run, so it is not
  # a stable history; it may later serve as an external check, not as part of
  # this evaluation.
  years: [2023, 2024, 2025]
  session_keys: []

  # "fraction":                order races by date and cut by proportion.
  # "years":                   assign whole seasons through the lists below.
  # "train_years_then_split":  whole seasons to train, then cut the rest.
  # Either way the unit is a whole race, never a lap.
  split_strategy: "train_years_then_split"
  train_years: [2023, 2024]

  # Of what remains after the training seasons (2025), the earlier half goes
  # to validation and the later half to test, so test sits after validation
  # in time. An odd race count leaves the extra race in validation.
  validation_share_of_remainder: 0.5

  # Used only by the other strategies.
  train_fraction: 0.6
  validation_fraction: 0.2
  validation_years: []
  test_years: []

  # Below this, a split is reported as too thin to evaluate anything.
  # A warning, not an error: the pipeline still runs on a small history.
  min_sessions_per_split: 3

  # All learned from the training races only.
  numeric_imputation: "median"
  add_missing_indicators: true
  scale_numeric: true

  random_seed: 42

  # Refuse to write anything when a leakage guard fails.
  fail_on_leakage: true
